[package]
name = "jcode-shell-minimizer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Deterministic bash-output minimizer ported from oh-my-pi / RTK"

[dependencies]
brush-parser = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3"
